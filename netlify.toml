# Netlify configuration file for RamenChat

[build]
  # Build command
  command = "npm run build"
  # Directory to publish (Vite output directory)
  publish = "dist"
  # Base directory (leave empty if project root is the base)
  # base = ""

[build.environment]
  # Node version (optional, Netlify uses Node 18 by default)
  NODE_VERSION = "18"

# SPA (Single Page Application) redirect rules
# This ensures all routes work correctly
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for security (optional but recommended)
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

